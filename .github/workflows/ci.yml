name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on PR re-push; never cancel main-branch runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python (mb umbrella)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: mb

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Plugin pin check against the real manifest
        # A bad marketplace pin (missing commit, wrong version, not the
        # first-party release tag, not on first-party main) must fail a required
        # check, so this lives in this job and not a new one. Full check, not
        # --offline; the offline form is for the manifest unit tests only.
        if: matrix.python-version == '3.12'
        run: python ../scripts/plugin_pin.py check

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy (strict package, checked tests)
        run: mypy mb tests

      - name: Pytest with coverage
        # -n auto spreads the suite over the runner's cores (#1094). Serially
        # it took 13-16 min on a fast runner and 22-26 min on a slow one, so
        # a full matrix often hit the cap. --durations keeps the slowest tests
        # visible in the log for the next timing question.
        run: >-
          pytest tests/ -n auto -v --durations=30
          --cov=mb --cov-report=term-missing --cov-fail-under=79

  macos-keychain:
    # Opt-in macOS keychain integration tests (#1008). Each test creates a
    # throwaway mbtest-*.keychain-db under the pytest temp dir, keeps it out
    # of the user search list, and deletes it afterwards; the login keychain
    # is never read or written. The interaction-off paths need no GUI session.
    # No secrets: the throwaway keychain password is generated per test.
    name: macOS keychain integration
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mb
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv and a non-framework Python
        # setup-python's macOS Python is a framework build: bin/python only
        # launches Python.app, so the tests' re-signed "foreign" interpreter
        # would still be the same app to the keychain. uv's managed Python
        # is a plain executable, like the maintainers' local runs.
        env:
          UV_MANAGED_PYTHON: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv==0.13.5"
          uv python install 3.12
          uv venv --python 3.12 .venv-keychain
          uv pip install --python .venv-keychain/bin/python -e ".[dev]"
          .venv-keychain/bin/python -c "import sysconfig, sys; fw = sysconfig.get_config_var('PYTHONFRAMEWORK'); print(sys.version, 'framework=' + repr(fw)); sys.exit(1 if fw else 0)"

      - name: Keychain integration tests
        env:
          MB_KEYCHAIN_INTEGRATION: "1"
        run: >-
          .venv-keychain/bin/python -m pytest tests/test_keychain_unattended.py -k macos -v -rs
          --junitxml=keychain-junit.xml

      - name: Fail if any keychain integration test was skipped
        # A skip here means the opt-in gate did not open, which would turn
        # this job into a silent no-op.
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          suite = ET.parse("keychain-junit.xml").getroot().find("testsuite")
          tests = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          print(f"keychain tests={tests} skipped={skipped}")
          if tests == 0 or skipped:
              raise SystemExit("::error::keychain integration tests did not all run")
          PY

  minimum-dependencies:
    # Installs every runtime dependency mb/pyproject.toml declares at its
    # lowest allowed version on the lowest supported Python and on 3.12, then
    # loads the CLI. `lowest-direct`, not `lowest`: transitive floors (for
    # example cryptography 2.0 under SecretStorage on Linux) no longer build.
    # Catches a declared floor that mb cannot actually run on (#997), including
    # one that only fails to build on a newer Python (pyyaml 6.0 on 3.12, #1028).
    # No secrets; read-only token.
    name: Minimum dependency floors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: mb
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install mb at its declared minimum dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv==0.13.5"
          uv venv --python "$(command -v python)" .venv-min
          uv pip install --python .venv-min/bin/python --resolution lowest-direct .
          uv pip list --python .venv-min/bin/python

      - name: Smoke — mb --help and mb skill list load on the floors
        run: |
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/mb/.venv-min/bin/mb" --help > help.txt
          grep -q "Usage:" help.txt \
            || { echo "::error::mb --help failed on minimum dependencies"; exit 1; }
          "$GITHUB_WORKSPACE/mb/.venv-min/bin/mb" skill list > skills.txt
          grep -qx "mb-start" skills.txt \
            || { echo "::error::mb skill list failed on minimum dependencies"; exit 1; }

  skill-validate:
    name: SKILL.md line-count gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mb
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Validate bundled skills
        run: mb skill validate --all --json
      - name: Validate playbook line-count gate
        run: |
          fail=0
          while IFS= read -r f; do
            n=$(wc -l < "../$f")
            if [ "$n" -gt 500 ]; then
              echo "::error file=$f::SKILL.md too long ($n lines > 500). Split references out."
              fail=1
            fi
          done < <(cd .. && find .claude/playbooks -name SKILL.md 2>/dev/null)
          exit $fail

  docs-lint:
    # Mirrors the docs naming gate in scripts/check.sh so a PR can't pass CI
    # with a filename that fails the local check. Keep the two in sync.
    name: Docs naming convention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Lowercase kebab-case filenames under docs/
        run: |
          fail=0
          while IFS= read -r rel; do
            base="$(basename "$rel")"
            if [ "$rel" = "docs/README.md" ]; then
              continue
            fi
            case "$rel" in
              docs/reports/*)
                if [[ "$base" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}- ]]; then
                  rest="${base#????-??-??-}"
                  if [[ ! "$rest" =~ ^[a-z0-9]+(-[a-z0-9]+)*\.md$ ]]; then
                    echo "::error file=$rel::after the YYYY-MM-DD- prefix, use lowercase kebab-case."
                    fail=1
                  fi
                  continue
                fi
                ;;
            esac
            if [[ ! "$base" =~ ^[a-z0-9]+(-[a-z0-9]+)*\.md$ ]]; then
              echo "::error file=$rel::use lowercase kebab-case (only docs/README.md may be all-caps)."
              fail=1
            fi
          done < <(find docs -type f -name '*.md' | sort)
          exit $fail

  wheel-install-smoke:
    # Release-path smoke test. The python matrix runs against an editable
    # install (``pip install -e .``), which can't catch packaging drift —
    # a missing ``py.typed`` in the built wheel, a stale
    # ``[tool.setuptools.package-data]`` entry, or an entry-point group
    # that only registers under editable mode. This job builds the wheel +
    # sdist the way PyPI will consume them, installs the wheel into a
    # clean venv (no repo sources on ``sys.path``), and runs the user-
    # facing smoke commands end-to-end.
    #
    # Single Python version — wheel packaging is pure-Python and doesn't
    # vary across 3.10/3.11/3.12 enough to justify matrixing. We pick 3.12
    # (latest supported target). Pattern borrowed from companyctx.
    #
    # Release wheels must carry the bundled engine root as package data.
    # The source tree keeps a single authoritative copy under .claude/;
    # setup.py copies that data into mb/_engine/.claude/ at build time.
    name: wheel-install-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mb
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify package data shipped in wheel
        # The editable install test suite can't catch a missing py.typed —
        # it reads straight from the source tree. A wheel without py.typed
        # silently degrades downstream mypy to Any. Fail loudly here.
        run: |
          wheel=$(ls dist/mainbranch-*.whl | head -n1)
          echo "inspecting $wheel"
          python -m zipfile -l "$wheel"
          python -m zipfile -l "$wheel" | grep -E '(^|/)mb/py\.typed([[:space:]]|$)' \
            || { echo "::error::py.typed missing from wheel"; exit 1; }
          python -m zipfile -l "$wheel" | grep -E '(^|/)mb/_engine/\.claude/skills/mb-start/SKILL\.md([[:space:]]|$)' \
            || { echo "::error::bundled skills missing from wheel"; exit 1; }
          python -m zipfile -l "$wheel" | grep -E '(^|/)mb/_engine/\.claude/skills/mb-update/SKILL\.md([[:space:]]|$)' \
            || { echo "::error::bundled mb-update skill missing from wheel"; exit 1; }
          python -m zipfile -l "$wheel" | grep -E '(^|/)mb/_engine/\.claude/playbooks/google-ads-search-launch/SKILL\.md([[:space:]]|$)' \
            || { echo "::error::bundled draft/manual playbook missing from wheel"; exit 1; }
          python -m zipfile -l "$wheel" | grep -E '(^|/)mb/_engine/playbooks/google-ads-search-launch/playbook\.md([[:space:]]|$)' \
            || { echo "::error::canonical Google Ads launch playbook source missing from wheel"; exit 1; }
          python -m zipfile -l "$wheel" | grep -E '(^|/)mb/_engine/playbooks/google-ads-search-launch/references/noontide-approach\.md([[:space:]]|$)' \
            || { echo "::error::Google Ads launch playbook references missing from wheel"; exit 1; }
          python -m zipfile -l "$wheel" | grep -E '(^|/)mb/_engine/playbooks/google-ads-search-launch/templates/push-playbook\.md([[:space:]]|$)' \
            || { echo "::error::Google Ads launch playbook template missing from wheel"; exit 1; }
          python -m zipfile -l "$wheel" | grep -E '(^|/)mb/_engine/workflows/mb-ads/workflow\.md([[:space:]]|$)' \
            || { echo "::error::canonical mb-ads workflow source missing from wheel"; exit 1; }
          python -m zipfile -l "$wheel" | grep -E '(^|/)mb/_engine/\.claude/reference/engine-path-resolution\.md([[:space:]]|$)' \
            || { echo "::error::bundled reference files missing from wheel"; exit 1; }
          python -m zipfile -l "$wheel" | grep -E '(^|/)mb/_engine/\.claude-plugin/plugin\.json([[:space:]]|$)' \
            || { echo "::error::Claude Code plugin prototype missing from wheel"; exit 1; }
          python -m zipfile -l "$wheel" | grep -E '(^|/)mb/_engine/\.claude-plugin/marketplace\.json([[:space:]]|$)' \
            || { echo "::error::plugin marketplace manifest missing from wheel — the install rail needs it"; exit 1; }

      - name: Create fresh venv and install the wheel
        # Fresh venv means no repo sources on sys.path — a genuine
        # release-path install. ``pip install <wheel>`` (not ``-e``) is
        # the point of this job; an editable install can't catch
        # package-data drift.
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/pip install --upgrade pip
          .venv-smoke/bin/pip install ./dist/mainbranch-*.whl

      - name: Smoke — mb --version
        # Exit 0 and emits ``mb <version>`` where <version> matches
        # the installed distribution metadata. Catches entry-point
        # registration drift (``[project.scripts]`` stale) and version
        # skew between ``mb.__version__`` and the wheel metadata.
        run: |
          expected="mb $(.venv-smoke/bin/python -c \
            'from importlib.metadata import version; print(version("mainbranch"))')"
          out=$(.venv-smoke/bin/mb --version)
          echo "expected=$expected"
          echo "actual=  $out"
          if [ "$out" != "$expected" ]; then
            echo "::error::--version output ($out) does not match installed dist metadata ($expected)"
            exit 1
          fi

      - name: Smoke — python -c "import mb; mb.__version__"
        # Catches missing __version__ attribute or import-time errors that
        # the CLI smoke might mask via Typer's exception handling.
        run: |
          .venv-smoke/bin/python -c '
          import mb
          assert hasattr(mb, "__version__"), "mb.__version__ missing"
          assert mb.__version__, "mb.__version__ empty"
          print("import ok:", mb.__version__)
          '

      - name: Smoke — mb --help (root help renders)
        # Catches Typer registration drift across subcommands. A broken
        # subcommand declaration crashes --help on import.
        run: |
          .venv-smoke/bin/mb --help > help.txt
          cat help.txt
          grep -qi "main branch\|scaffolds" help.txt \
            || { echo "::error::root --help output missing expected description"; exit 1; }

      - name: Smoke — bare mb launch screen renders in a TTY
        # The default no-args command is intentionally TTY-sensitive:
        # non-interactive callers get command help, humans get the launch
        # screen. Unit tests monkeypatch this, but the wheel smoke proves the
        # installed console script renders the real TTY path.
        run: |
          .venv-smoke/bin/python - <<'PY'
          import os
          import pty
          import subprocess

          master, slave = pty.openpty()
          try:
              proc = subprocess.Popen(
                  [".venv-smoke/bin/mb"],
                  stdin=slave,
                  stdout=slave,
                  stderr=slave,
                  text=False,
              )
              os.close(slave)
              chunks = []
              while True:
                  try:
                      chunk = os.read(master, 4096)
                  except OSError:
                      break
                  if not chunk:
                      break
                  chunks.append(chunk)
              rc = proc.wait(timeout=5)
          finally:
              os.close(master)

          out = b"".join(chunks).decode("utf-8", errors="replace")
          print(out)
          if rc != 0:
              raise SystemExit(f"mb exited {rc}")
          for expected in ("Choose a trail", "mb status", "mb doctor", "mb --help"):
              if expected not in out:
                  raise SystemExit(f"launch screen missing {expected!r}")
          if "Usage:" in out:
              raise SystemExit("TTY launch screen fell back to command help")
          PY

      - name: Smoke — mb --plain keeps non-interactive command help
        run: |
          .venv-smoke/bin/mb --plain > plain.txt
          cat plain.txt
          grep -q "Usage:" plain.txt \
            || { echo "::error::mb --plain did not render command help"; exit 1; }
          ! grep -q "Choose a trail" plain.txt \
            || { echo "::error::mb --plain rendered launch screen"; exit 1; }

      - name: Smoke — mb skill list is populated
        run: |
          .venv-smoke/bin/mb skill list > skills.txt
          cat skills.txt
          grep -qx "mb-start" skills.txt \
            || { echo "::error::mb skill list missing bundled mb-start skill"; exit 1; }
          grep -qx "mb-think" skills.txt \
            || { echo "::error::mb skill list missing bundled mb-think skill"; exit 1; }
          grep -qx "mb-update" skills.txt \
            || { echo "::error::mb skill list missing bundled mb-update skill"; exit 1; }

      - name: Smoke — packaged bundled skills validate
        run: |
          .venv-smoke/bin/mb skill validate --all --json > skill-validate.json
          cat skill-validate.json
          .venv-smoke/bin/python - <<'PY'
          import json

          report = json.load(open("skill-validate.json"))
          assert report["ok"] is True
          assert report["summary"]["skills"] > 0
          assert report["summary"]["failed"] == 0
          PY

      - name: Smoke — mb init wires Claude Code skills
        run: |
          repo=$(mktemp -d)
          .venv-smoke/bin/mb init "$repo" --name "Acme Brewing"
          test -f "$repo/.claude/settings.local.json" \
            || { echo "::error::settings.local.json missing"; exit 1; }
          test -f "$repo/.claude/skills/mb-start/SKILL.md" \
            || { echo "::error::mb-start skill bridge missing"; exit 1; }
          .venv-smoke/bin/python - "$repo" <<'PY'
          import json, pathlib, sys
          repo = pathlib.Path(sys.argv[1])
          settings = json.loads((repo / ".claude/settings.local.json").read_text())
          dirs = settings["permissions"]["additionalDirectories"]
          assert dirs, "additionalDirectories empty"
          root = pathlib.Path(dirs[0])
          assert (root / ".claude/skills/mb-start/SKILL.md").is_file(), root
          assert (root / ".claude/reference/engine-path-resolution.md").is_file(), root
          PY

      - name: Smoke — mb onboard creates a business repo
        run: |
          repo="$(mktemp -d)/acme-brewing"
          .venv-smoke/bin/mb onboard --yes --name "Acme Brewing" --path "$repo" --json > onboard.json
          cat onboard.json
          test -f "$repo/CLAUDE.md" \
            || { echo "::error::CLAUDE.md missing after onboard"; exit 1; }
          test -f "$repo/.claude/skills/mb-start/SKILL.md" \
            || { echo "::error::mb-start skill bridge missing after onboard"; exit 1; }
          .venv-smoke/bin/python - "$repo" <<'PY'
          import json, pathlib, sys

          repo = pathlib.Path(sys.argv[1])
          report = json.load(open("onboard.json"))
          assert report["ok"] is True
          assert report["repo"]["looks_initialized"] is True
          assert report["skill_wiring"]["ok"] is True
          assert report["path"] == str(repo.resolve())
          PY

      - name: Smoke — mb start emits handoff JSON
        run: |
          repo="$(mktemp -d)/acme-brewing"
          .venv-smoke/bin/mb onboard --yes --name "Acme Brewing" --path "$repo" --json >/dev/null
          set +e
          .venv-smoke/bin/mb start --repo "$repo" --json > start.json
          rc=$?
          set -e
          cat start.json
          if [ "$rc" -gt 1 ]; then
            echo "::error::mb start --json crashed (exit $rc)"
            exit 1
          fi
          .venv-smoke/bin/python - "$repo" <<'PY'
          import json, pathlib, sys

          repo = pathlib.Path(sys.argv[1])
          report = json.load(open("start.json"))
          assert report["repo"]["looks_like_mainbranch_repo"] is True
          assert report["runtime"]["skill_wiring"]["ok"] is True
          assert report["command"]["cwd"] == str(repo.resolve())
          assert report["command"]["follow_up"] == "/mb-start"
          assert report["launch"]["attempted"] is False
          PY

      - name: Smoke — mb start rejects JSON launch mode
        run: |
          repo="$(mktemp -d)/acme-brewing"
          .venv-smoke/bin/mb onboard --yes --name "Acme Brewing" --path "$repo" --json >/dev/null
          set +e
          .venv-smoke/bin/mb start --repo "$repo" --json --launch > start-launch.json
          rc=$?
          set -e
          cat start-launch.json
          if [ "$rc" -ne 2 ]; then
            echo "::error::mb start --json --launch should exit 2, got $rc"
            exit 1
          fi
          .venv-smoke/bin/python - <<'PY'
          import json

          report = json.load(open("start-launch.json"))
          assert report["ok"] is False
          assert report["launch"]["requested"] is True
          assert report["launch"]["attempted"] is False
          assert "--json" in report["launch"]["blocked_reason"]
          PY

      - name: Smoke — mb status on initialized repo emits JSON
        run: |
          repo=$(mktemp -d)
          .venv-smoke/bin/mb init "$repo" --name "Acme Brewing"
          .venv-smoke/bin/mb status "$repo" --json > status.json
          cat status.json
          .venv-smoke/bin/python - <<'PY'
          import json

          report = json.load(open("status.json"))
          assert report["repo"]["looks_like_mainbranch_repo"] is True
          assert report["runtime"]["skill_wiring"]["ok"] is True
          assert "readiness" in report
          assert "next_actions" in report["readiness"]
          PY

      - name: Smoke — mb update check emits JSON envelope
        # A plain venv wheel is neither the recommended pipx install nor a
        # source clone, so the command may exit 1. That is acceptable here:
        # this smoke asserts the installed command degrades with structured
        # JSON instead of crashing or printing prose-only diagnostics.
        run: |
          set +e
          .venv-smoke/bin/mb update --check --json > update.json
          rc=$?
          set -e
          cat update.json
          if [ "$rc" -gt 1 ]; then
            echo "::error::mb update --check crashed (exit $rc)"
            exit 1
          fi
          .venv-smoke/bin/python - <<'PY'
          import json

          report = json.load(open("update.json"))
          assert "ok" in report
          assert "mode" in report
          assert "errors" in report
          assert "actions" in report
          PY

      - name: Smoke — mb doctor (runs against empty cwd)
        # A second user-facing CLI surface that doesn't depend on bundled
        # skills. Runs in a temp dir so doctor lands a real diagnosis
        # against an empty repo (it should exit non-zero with a report,
        # which is fine — the check is "does it crash?").
        run: |
          mkdir -p /tmp/doctor-smoke && cd /tmp/doctor-smoke
          set +e
          $GITHUB_WORKSPACE/mb/.venv-smoke/bin/mb doctor . --json > out.json
          rc=$?
          set -e
          echo "doctor exit=$rc"
          # Exit 0 (clean) or 1 (red checks) are both acceptable. Anything
          # else (2+, segfault) means the command itself broke.
          if [ "$rc" -gt 1 ]; then
            cat out.json
            echo "::error::mb doctor crashed (exit $rc)"
            exit 1
          fi
          # Verify it emitted valid JSON.
          python3 -c 'import json; json.load(open("out.json"))'
