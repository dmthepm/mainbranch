[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mainbranch"
version = "0.6.15"
description = "Main Branch engine umbrella - scaffolds, validates, and graphs business-as-files repos. Claude Code first, runtime-agnostic by design."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Devon Meadows", email = "devon@noontide.co" }
]
keywords = [
  "cli",
  "business-as-files",
  "claude-code",
  "skills",
  "scaffolding",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]
dependencies = [
  "openai>=1.0",
  "typer>=0.15.4",
  "pyyaml>=6.0.1",
  "rich>=13.0",
  "SecretStorage>=3.5; sys_platform == 'linux'",
]

[project.optional-dependencies]
ogrender = [
  "cairosvg>=2.7",
]
dev = [
  "ruff~=0.6",
  "mypy>=1.10,<3.0",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pytest-xdist>=3.5,<4",
  "types-PyYAML",
]

[project.scripts]
mb = "mb.cli:app"

[project.urls]
Homepage = "https://github.com/noontide-co/mainbranch"
Repository = "https://github.com/noontide-co/mainbranch"
Issues = "https://github.com/noontide-co/mainbranch/issues"
Documentation = "https://github.com/noontide-co/mainbranch/blob/main/docs/beginner-setup.md"
Changelog = "https://github.com/noontide-co/mainbranch/blob/main/CHANGELOG.md"
Support = "https://github.com/noontide-co/mainbranch/blob/main/SUPPORT.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["mb*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
mb = [
  "_data/**/*",
  "_data/templates/.gitignore.tmpl",
  "_engine/**/*",
  "_engine/.claude/**/*",
  "_engine/.claude-plugin/**/*",
  "py.typed",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["yaml.*", "rich.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
# Check test bodies without forcing every pytest fixture parameter to be annotated.
disallow_untyped_defs = false
check_untyped_defs = true
disable_error_code = ["no-untyped-def"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.report]
# Block merge if total coverage drops below 79%. Tests don't have to cover
# every branch — they have to cover the ones the user actually hits.
fail_under = 79
